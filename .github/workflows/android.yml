name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WhichWayIn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WhichWayIn-apk
          path: WhichWayIn.apk

      # Keep one "latest" release so the newest APK is always at the same link
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WhichWayIn.apk \
            --title "Which Way In (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download WhichWayIn.apk on your phone to install or update."
