plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.whichwayin'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.whichwayin'
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName '1.0'
    }

    // Fixed debug key so new builds install over old ones
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // The app is the same page that runs in the browser
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
